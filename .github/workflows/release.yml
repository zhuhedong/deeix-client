name: Release

# Publishes a GitHub Release with Android APKs when a version tag is pushed:
#   git tag v1.2.0 && git push origin v1.2.0
#
# Signing (optional, strongly recommended) — repository secrets:
#   ANDROID_KEYSTORE_BASE64   base64 of the release .jks (base64 -w0 release.jks)
#   ANDROID_KEYSTORE_PASSWORD store password
#   ANDROID_KEY_ALIAS         key alias
#   ANDROID_KEY_PASSWORD      key password
# Without them the APKs are signed with a throwaway DEBUG key. Such builds
# install fine on a clean device, but cannot update an install signed with a
# different key (Android rejects the signature change), and the debug key
# differs between CI runs — so in-app updates only work reliably with a fixed
# release keystore.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Build & publish Android APKs
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true

      - name: Resolve version from tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag '$TAG' is not vX.Y.Z[-pre]"; exit 1
          fi
          PUBSPEC=$(grep -E '^version:' pubspec.yaml | sed -E 's/version: *([^+]+).*/\1/')
          if [ "$PUBSPEC" != "$VERSION" ]; then
            echo "::warning::pubspec.yaml version ($PUBSPEC) != tag ($VERSION); building with the tag version."
          fi
          PRE=false; case "$VERSION" in *-*) PRE=true;; esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"

      - name: Configure release signing
        if: env.KEYSTORE_B64 != ''
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Warn about debug signing
        if: env.KEYSTORE_B64 == ''
        run: |
          echo "::warning::ANDROID_KEYSTORE_BASE64 is not set — APKs are DEBUG-signed. Users cannot update in place across differently signed builds. See README › Releasing."

      - name: Install dependencies
        run: flutter pub get

      - name: Test
        run: flutter test

      - name: Build split-per-ABI APKs
        run: >
          flutter build apk --release --split-per-abi
          --build-name=${{ steps.ver.outputs.version }}
          --build-number=${{ github.run_number }}

      - name: Build universal APK
        run: >
          flutter build apk --release
          --build-name=${{ steps.ver.outputs.version }}
          --build-number=${{ github.run_number }}

      - name: Collect artifacts
        run: |
          set -e
          OUT=dist; mkdir -p "$OUT"
          SRC=build/app/outputs/flutter-apk
          T="${{ steps.ver.outputs.tag }}"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "$SRC/app-$abi-release.apk" "$OUT/deeix-client-$T-$abi.apk"
          done
          cp "$SRC/app-release.apk" "$OUT/deeix-client-$T-universal.apk"
          (cd "$OUT" && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)
          rm -f android/key.properties

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Deeix Client ${{ steps.ver.outputs.tag }}
          prerelease: ${{ steps.ver.outputs.prerelease }}
          generate_release_notes: true
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
